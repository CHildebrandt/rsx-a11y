[workspace]
members = ["playground"]

[package]
name = "rsx-a11y"
version = "0.1.4"
edition = "2024"
description = "A linting tool for checking ARIA and accessibility attributes in Rust web frameworks (Yew, Leptos, Dioxus)"
license = "MIT"
repository = "https://github.com/CHildebrandt/rsx-a11y"

[features]
default = ["cli"]
## The `rsx-a11y` command-line tool.
cli = ["dep:clap", "dep:colored", "dep:dunce", "parallel"]
## Lint files in parallel with rayon.
parallel = ["dep:rayon"]

[dependencies]
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "3", optional = true }
rayon = { version = "1", optional = true }
dunce = { version = "1", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
rstml = "0.12.1"

[[bin]]
name = "rsx-a11y"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 'z'
codegen-units = 1
lto = true
