[workspace]
members = ["playground"]

[package]
name = "rsx-a11y"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Accessibility (a11y) and WAI-ARIA linter for Yew, Leptos and Dioxus markup"
license = "MIT"
repository = "https://github.com/CHildebrandt/rsx-a11y"
homepage = "https://childebrandt.github.io/rsx-a11y/"
documentation = "https://docs.rs/rsx-a11y"
readme = "README.md"
keywords = ["accessibility", "a11y", "aria", "lint", "wcag"]
categories = ["accessibility", "development-tools", "command-line-utilities", "web-programming"]
# Ship only what is needed to build, test and document the crate.
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[features]
default = ["cli"]
## The `rsx-a11y` command-line tool.
cli = ["dep:clap", "dep:colored", "dep:dunce", "parallel"]
## Lint files in parallel with rayon.
parallel = ["dep:rayon"]

[dependencies]
syn = { version = "3", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "3", optional = true }
rayon = { version = "1", optional = true }
dunce = { version = "1", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
rstml = "0.13.1"

[[bin]]
name = "rsx-a11y"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[profile.release]
opt-level = 'z'
codegen-units = 1
lto = true
